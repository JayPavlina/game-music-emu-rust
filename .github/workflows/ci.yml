name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Build, Lint, Format, and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up C++ build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libasound2-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.8.0
      - name: Install dependencies
        run: cargo fetch
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Check for unused dependencies
        run: cargo machete

  format-features:
    name: Test individual Rust format features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build without format decoders
        run: cargo check -p game-music-emu --no-default-features
      - name: Test each format on its own
        run: |
          for format in ay gbs gym hes kss nsf nsfe sap spc vgm; do
            cargo test -p game-music-emu --no-default-features --features "$format" --lib --tests
          done
