[workspace]
members = [
    "crates/gme-core",
    "crates/gme-common",
    "crates/gme-nsf",
    "crates/gme-spc",
    "crates/gme-gbs",
    "crates/gme-vgm",
    "crates/gme-sap",
    "crates/gme-kss",
    "crates/gme-ay",
    "crates/gme-gym",
    "crates/gme-hes",

    "crates/game-music-emu",
    "crates/game-music-emu-wrapper",
]
default-members = ["crates/game-music-emu"]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/JayPavlina/Game-Music-Emu-Rust"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
# Internal crates
gme-core = { path = "crates/gme-core" }
gme-common = { path = "crates/gme-common" }
gme-nsf = { path = "crates/gme-nsf" }
gme-spc = { path = "crates/gme-spc" }
gme-gbs = { path = "crates/gme-gbs" }
gme-vgm = { path = "crates/gme-vgm" }
gme-sap = { path = "crates/gme-sap" }
gme-kss = { path = "crates/gme-kss" }
gme-ay = { path = "crates/gme-ay" }
gme-gym = { path = "crates/gme-gym" }
gme-hes = { path = "crates/gme-hes" }
game-music-emu-wrapper = { path = "crates/game-music-emu-wrapper" }

# External crates
cpal = "0.18"
criterion = "0.8"
thiserror = "2"
flate2 = "1"
cc = "1.2"
