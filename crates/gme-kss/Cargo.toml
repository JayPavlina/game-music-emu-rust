[package]
name = "gme-kss"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "MSX KSS music emulator for game-music-emu"

[features]
# Per-instruction/per-OUT differential-trace hooks (KSS_CPU_TRACE_RS,
# KSS_OUT_TRACE_RS). Compiled out by default; enable for diagnostics with
# `cargo test -p gme-kss --features trace`.
trace = []

[dependencies]
gme-core.workspace = true
gme-common.workspace = true
gme-vgm.workspace = true

[dev-dependencies]
game-music-emu-wrapper.workspace = true
