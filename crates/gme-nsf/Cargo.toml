[package]
name = "gme-nsf"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "NES NSF music emulator"

[features]
# Per-instruction/per-write differential-trace hooks (NSF_CPU_TRACE_RS,
# NSF_APU_TRACE_RS). Compiled out by default; enable for diagnostics with
# `cargo test -p gme-nsf --features trace`.
trace = []

[dependencies]
gme-core.workspace = true
gme-common.workspace = true

[dev-dependencies]
game-music-emu-wrapper.workspace = true
