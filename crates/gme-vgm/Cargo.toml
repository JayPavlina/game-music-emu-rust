[package]
name = "gme-vgm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VGM (Sega SMS/Genesis) music emulator for game-music-emu"

[features]
ym2612_emu_gens = []
ym2612_emu_mame = ["dep:gme-ym2612-mame"]

[dependencies]
gme-ym2612-mame = { version = "0.1.0", path = "../gme-ym2612-mame", optional = true }
gme-core.workspace = true
gme-common.workspace = true

[dev-dependencies]
game-music-emu-wrapper = { workspace = true, features = ["vgm", "ym2612-reference-tests"] }
